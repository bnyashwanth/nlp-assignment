name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor Android
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm run build
          npx cap sync android

      - name: Bake Xenova NLLB-200 ONNX model into Android assets
        env:
          HF_BASE: https://huggingface.co/Xenova/nllb-200-distilled-600M/resolve/main
        run: |
          mkdir -p android/app/src/main/assets/nllb
          curl -fL "$HF_BASE/onnx/encoder_model_quantized.onnx" -o android/app/src/main/assets/nllb/encoder_model_quantized.onnx
          curl -fL "$HF_BASE/onnx/decoder_model_merged_quantized.onnx" -o android/app/src/main/assets/nllb/decoder_model_merged_quantized.onnx
          curl -fL "$HF_BASE/tokenizer.json" -o android/app/src/main/assets/nllb/tokenizer.json
          curl -fL "$HF_BASE/sentencepiece.bpe.model" -o android/app/src/main/assets/nllb/sentencepiece.bpe.model
          curl -fL "$HF_BASE/config.json" -o android/app/src/main/assets/nllb/config.json

      - name: Build debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguabridge-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
